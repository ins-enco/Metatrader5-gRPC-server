services:
  mt5-grpc-server:
    build:
      context: ../..
      dockerfile: deploy/wine-docker/Dockerfile
    image: mt5-grpc-server:wine
    container_name: mt5-grpc-server
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      WINEPREFIX: /wineprefix
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      GRPC_VERBOSE: "true"
      NUMPY_SPEC: "numpy<2"
      MT5_SETUP_URL: "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
      MT5_TERMINAL_PATH: 'C:\Program Files\MetaTrader 5\terminal64.exe'
      MT5_INSTALL_TIMEOUT: "600"
      MT5_STARTUP_DELAY: "20"
    volumes:
      - wineprefix:/wineprefix
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  wineprefix:
