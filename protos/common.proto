syntax = "proto3";

package metatrader.v1;

// Order type (shared by trade requests and order calculations).
// Values are the verbatim MT5 ENUM_ORDER_TYPE numeric values; the first member
// is the real MT5 zero (ORDER_TYPE_BUY), satisfying proto3's zero-value rule.
enum ENUM_ORDER_TYPE {
  ORDER_TYPE_BUY             = 0;  // Market Buy order
  ORDER_TYPE_SELL            = 1;  // Market Sell order
  ORDER_TYPE_BUY_LIMIT       = 2;  // Buy Limit pending order
  ORDER_TYPE_SELL_LIMIT      = 3;  // Sell Limit pending order
  ORDER_TYPE_BUY_STOP        = 4;  // Buy Stop pending order
  ORDER_TYPE_SELL_STOP       = 5;  // Sell Stop pending order
  ORDER_TYPE_BUY_STOP_LIMIT  = 6;  // Buy Stop Limit pending order
  ORDER_TYPE_SELL_STOP_LIMIT = 7;  // Sell Stop Limit pending order
  ORDER_TYPE_CLOSE_BY        = 8;  // Close a position by an opposite one
}

// Error details
message Error {
  int32 code = 1;
  string message = 2;
}

// Request for getting the last error
message GetLastErrorRequest {}

// Response for getting the last error
message GetLastErrorResponse {
  Error error = 1;
}

// Service definition
service MetaTraderService {
  rpc Connect(ConnectRequest) returns (Error);
  rpc GetLastError(Empty) returns (GetLastErrorResponse);
} 

message Empty {}

message ConnectRequest {
  optional string path = 1;  // Optional path to MetaTrader executable, use default if not specified

  // Account number
  optional int64 login = 2;
  
  // Password
  optional string password = 3;

  // Trade server
  optional string server = 4;
}

message TimeFilter {
  int64 date_from = 1;  // Unix timestamp in seconds since 1970.01.01
  int64 date_to = 2;    // Unix timestamp in seconds since 1970.01.01
}